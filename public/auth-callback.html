<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth Callback</title>
  </head>
  <body>
    <p>Auth</p>
    <script>
      if (window.opener) {
        window.opener.postMessage(window.location.href, "*");
        window.close();
      } else {
        window.location.href = "/";
      }
    </script>
  </body>
</html>
